[package]
name = "skyward_seal"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "skyward_seal"
crate-type = ["cdylib", "staticlib", "rlib"]

# The clean game only needs the slot math, so this crate carries no
# dependencies — the reel RNG and the evaluator are self-contained.

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
