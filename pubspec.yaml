name: bright_horizon
description: Bright Horizon, a social casino.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.14.0
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/loading/
    - assets/cabinet/
    - assets/symbols/
