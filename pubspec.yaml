name: bright_horizon
description: Bright Horizon, an observation arcade.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.5.1
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/Bright_Horizon_additional_assets/
    - assets/Bright_Horizon_gameplay_assets/
    - assets/Bright_Horizon_sounds_assets/
